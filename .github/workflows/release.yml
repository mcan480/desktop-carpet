# Builds the Windows installer on GitHub's Windows machines and publishes it as a release.
# Trigger: any push to main. If package.json has a version that has no release yet, it builds and
# publishes release v<version> (the tag is created automatically). Notes come from release-notes/v<version>.md.
# The app's auto-updater and the site's download button both use the asset name DesktopCarpet-Setup.exe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "Release v$v already exists, nothing to do."; "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
          else { "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
          exit 0

      - name: Install
        if: steps.ver.outputs.skip != 'true'
        run: npm install --no-audit --no-fund

      - name: Build app
        if: steps.ver.outputs.skip != 'true'
        run: node build.cjs

      - name: Build installer
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress; $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $mk /V2 "/DVERSION=$env:VERSION" installer\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Desktop Carpet ${{ env.VERSION }} for Windows
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes/v${{ env.VERSION }}.md
          files: dist/DesktopCarpet-Setup.exe
          fail_on_unmatched_files: true
